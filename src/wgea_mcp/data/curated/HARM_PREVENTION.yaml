id: HARM_PREVENTION
name: WGEA Harm Prevention — sexual harassment + DV policy responses (annual)
description: |
  Per-employer responses to the WGEA questionnaire's "Harm prevention" section:
  formal sexual-harassment policies, family/domestic violence support, training
  programs, complaint mechanisms, and respect-at-work measures.

  Answers: "does <employer> have a sexual harassment policy?", "which
  employers support staff experiencing family/domestic violence?", "which
  industries are leading on respect-at-work training?". ~342 MB in the
  2024-25 release — the largest of the questionnaire CSVs.
period_coverage: latest WGEA reporting year (2024-25 in the 2025 release)
update_frequency: annual
source_url: https://data.gov.au/data/dataset/wgea-dataset
zip_member: wgea_questionnaire_harm_prevention_2025.csv
format: csv_in_zip
layout: long
cache_kind: data
period_column: reporting_year
search_keywords:
  - sexual harassment
  - harassment
  - sex discrimination
  - domestic violence
  - dv
  - family violence
  - respect at work
  - bullying
  - harm prevention
  - safety
