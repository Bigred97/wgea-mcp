id: PARENTAL_LEAVE_FLEX
name: WGEA Parental Leave + Flexible Work — employer policy responses (annual)
description: |
  Per-employer responses to the WGEA questionnaire's "Flexible work" section:
  parental leave offerings (paid weeks, gender-neutral, employee tenure
  requirement), flexible work options (compressed weeks, remote work, part-time
  arrangements), and post-parental-leave return-to-work programs.

  Answers: "which employers offer paid parental leave to fathers?", "what
  flexible work options does Atlassian offer?", "which industries have the
  best return-to-work rates?". ~119 MB in the 2024-25 release.
period_coverage: latest WGEA reporting year (2024-25 in the 2025 release)
update_frequency: annual
source_url: https://data.gov.au/data/dataset/wgea-dataset
zip_member: wgea_questionnaire_flexible_work_2025.csv
format: csv_in_zip
layout: long
cache_kind: data
period_column: reporting_year
search_keywords:
  - parental leave
  - paid parental leave
  - maternity
  - paternity
  - flexible work
  - flexible working
  - flexible work from home
  - work from home
  - remote work
  - compressed week
  - part time
  - job sharing
  - return to work
  - wfh
