id: EMPLOYEE_SUPPORT
name: WGEA Employee Support — carer + dependant + employee-support responses (annual)
description: |
  Per-employer responses to the WGEA questionnaire's "Employee support" section:
  carer leave, dependant support, employee assistance programs, mental health
  policies, and broader inclusion measures.

  Answers: "does <employer> offer EAP support?", "which industries best
  support carers?", "what mental-health programs do tech companies offer?".
  ~162 MB in the 2024-25 release.
period_coverage: latest WGEA reporting year (2024-25 in the 2025 release)
update_frequency: annual
source_url: https://data.gov.au/data/dataset/wgea-dataset
zip_member: wgea_questionnaire_employee_support_2025.csv
format: csv_in_zip
layout: long
cache_kind: data
period_column: reporting_year
search_keywords:
  - carer support
  - carer leave
  - eap
  - mental health
  - wellbeing
  - inclusion
  - dependants
  - chronic illness
  - disability
  - employee assistance
