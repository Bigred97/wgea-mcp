id: HEADLINE_GAP
name: WGEA Headline Gender Pay Gap — mid-point of employer gaps, by ANZSIC division (annual)
description: |
  The headline industry-level gender pay gap percentages WGEA publishes in
  its annual Employer Gender Pay Gaps Report. One row per ANZSIC division
  (19 divisions) plus a synthetic "All employers" national row — fetched
  from the official WGEA spreadsheet, aggregated server-side to a small
  agent-friendly response (~20 rows × 5 measures).

  Answers the most-searched WGEA question — "what's Australia's gender pay
  gap?" / "what's the pay gap in mining?" — in a single call. The other
  seven WGEA curated datasets are per-employer questionnaire responses;
  none of them carry the rolled-up industry pay-gap percentage because
  WGEA aggregates remuneration data BEFORE publishing the per-employer
  CSVs.

  Methodology — three flavours of GPG so you can pick the one
  that matches your question:

  HEADLINE_GAP measures
  ─────────────────────
    `employee_weighted_total_rem_gap_pct` / `_base_salary_...`
        ⭐ This is WGEA's published "Mean Total Remuneration GPG"
          (~21.1% for 2024-25 All-employers). Workforce-weighted: each
          employee contributes equally, derived from the employer's
          % women + average pay + size band. Reproduces WGEA's Scorecard
          headline within ~0.6pp. USE THIS for "Australia's gender pay
          gap" headline comparisons.
    `total_remuneration_gap_pct` / `base_salary_gap_pct`
        = mean of per-employer "Average ... GPG (%)" — unweighted, one
          employer one vote. Lower than the employee-weighted figure
          because most employers are small and small employers have
          smaller absolute pay gaps.
    `median_total_rem_gap_pct` / `median_base_salary_gap_pct`
        = median of per-employer "Median ... GPG (%)" — the typical
          (middle) employer's gap. Strips outliers.

  What HEADLINE_GAP IS useful for
  ──────────────────────────────
  - WGEA-headline-style national + per-industry GPG comparisons
    (use the employee_weighted measures)
  - "Typical employer's gap" in industry X (use the median measures)
  - Outlier-employer detection (compare mean vs median measures)
  - Tracking the same measure over reporting years

  Notes:
  - Percentages are out of 100 (so 21.4 = 21.4%, NOT 0.214).
  - Filter `anzsic_division` is permissive — pass the full division name
    ('Mining', 'Financial and Insurance Services'), the canonical letter
    ('B', 'K'), or 'All employers' for the national row.
  - Source xlsx is fetched directly from wgea.gov.au (not data.gov.au —
    WGEA does not publish the aggregated spreadsheet to CKAN; only the
    per-employer questionnaire CSVs land there).
period_coverage: latest WGEA reporting year (2024-25 in the 2025 release)
update_frequency: annual
source_url: https://www.wgea.gov.au/publications/employer-gender-pay-gaps-report
download_url: https://www.wgea.gov.au/sites/default/files/documents/Employer-Gender-Pay-Gaps-Spreadsheet.xlsx
zip_member: "2. Employers "
format: xlsx_aggregated
layout: wide
cache_kind: data
period_column: reporting_year
industry_caveat: |
  Per-industry figures use a different weighting methodology (re-weighted
  only across employers in that ANZSIC division) than WGEA's national
  headline and are NOT directly comparable to the national "All employers"
  figure. Per-industry employee-weighted GPG can be materially higher
  (e.g. Finance ~28%) or lower (e.g. Mining ~11%) than the national
  headline (~21.1%) because industries differ in gender composition and
  employer-size distribution. Use this measure for within-dataset
  industry comparisons, not as a stand-in for "Australia's gender pay gap".
search_keywords:
  - headline
  - pay gap
  - gender pay gap
  - gpg
  - industry
  - division
  - anzsic
  - sector
  - mining
  - finance
  - construction
  - retail
  - healthcare
  - national
  - australia
  - mid-point
  - midpoint
  - aggregate
  - benchmark
  - remuneration
  - base salary
  - median
columns:
  reporting_year:
    source_column: reporting_year
    description: "WGEA reporting year (e.g. '2024-25'). Runs 1 April → 31 March."
    role: dimension
    dtype: string
  anzsic_division:
    source_column: anzsic_division
    description: "ANZSIC division name (e.g. 'Mining', 'Financial and Insurance Services') or 'All employers' for the synthetic national row. Permissive — passes through to filter logic so 'mining', 'b' (the letter), 'All employers', or any free-text value reaches the matcher."
    role: dimension
    dtype: string
    permissive: true
  employer_size_band:
    source_column: employer_size_band
    description: |
      Employer size band — WGEA's reporting bands ('<250', '250-499',
      '500-999', '1000-4999', '5000+'). Defaults to 'all' (across all
      bands) when omitted — the response then carries the single
      all-bands aggregate row rather than the five per-band fragment
      rows. Customers filtering by band get the GPG distribution
      isolated to that employer-size cohort (e.g. 'how does the gap
      look for 5000+ employers vs <250?').
    role: dimension
    dtype: string
    permissive: true
    default_value: "all"
  total_remuneration_gap_pct:
    source_column: total_remuneration_gap_pct
    description: "Mid-point of employer Average Total Remuneration gender pay gap (%) across the division. WGEA's headline measure — includes base salary plus overtime, bonuses, additional payments, and the annualised full-time-equivalent salary of casual/part-time workers."
    unit: percent
    role: measure
    dtype: float
  base_salary_gap_pct:
    source_column: base_salary_gap_pct
    description: "Mid-point of employer Average Base Salary gender pay gap (%) across the division. Base salary excludes overtime + bonuses — narrower than the total-remuneration measure."
    unit: percent
    role: measure
    dtype: float
  median_total_rem_gap_pct:
    source_column: median_total_rem_gap_pct
    description: "Mid-point of employer Median Total Remuneration gender pay gap (%) across the division. Median strips the influence of high-earning outliers, so this is usually smaller than total_remuneration_gap_pct."
    unit: percent
    role: measure
    dtype: float
  median_base_salary_gap_pct:
    source_column: median_base_salary_gap_pct
    description: "Mid-point of employer Median Base Salary gender pay gap (%) across the division."
    unit: percent
    role: measure
    dtype: float
  employee_weighted_total_rem_gap_pct:
    source_column: employee_weighted_total_rem_gap_pct
    description: |
      Workforce-weighted Mean Total Remuneration gender pay gap (%) using
      employer size-band midpoints as headcount proxies.

      Scope depends on the `anzsic_division` filter:
        - `anzsic_division='all'` (or no industry filter, all-sizes row) →
          NATIONAL headline weighted across the whole private-sector
          reporting population. Matches WGEA's published Scorecard
          headline (21.1% for 2024-25; this dataset computes 21.66% from
          the per-employer xlsx, within 0.6pp of WGEA's authoritative
          figure).
        - Any specific division ('Mining', 'K', 'Financial and Insurance
          Services', etc.) → INDUSTRY-weighted gap, computed by re-weighting
          only the employers in that ANZSIC division. Per-industry figures
          can be much higher (Finance ~28%) or lower (Mining ~11%) than
          the national headline because industries differ in their
          gender composition and employer-size distribution. Per-industry
          figures are NOT comparable directly to WGEA's national 21.1%.

      Use this measure for "Australia's gender pay gap" headlines, OR for
      per-industry comparisons WITHIN this dataset. Prefer
      `total_remuneration_gap_pct` (unweighted, one-employer-one-vote)
      only when you specifically want to ignore size weighting.
    unit: percent
    role: measure
    dtype: float
  employee_weighted_base_salary_gap_pct:
    source_column: employee_weighted_base_salary_gap_pct
    description: |
      Workforce-weighted Mean Base Salary gender pay gap (%). Same
      methodology as `employee_weighted_total_rem_gap_pct` but on the
      base-salary GPG column (excludes overtime + bonuses). Scope-vs-
      filter behaviour is identical: 'all employers' = national; a
      specific division = industry-weighted within that division.
    unit: percent
    role: measure
    dtype: float
  employer_count:
    source_column: employer_count
    description: "Number of WGEA-reporting private-sector employers contributing to the mid-point for this division (or all of them, for the 'All employers' row)."
    unit: employers
    role: measure
    dtype: integer
