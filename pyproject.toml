[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wgea-mcp"
version = "0.6.8"
description = "MCP server for the Workplace Gender Equality Agency (WGEA) public data file. Plain-English access to per-employer workforce composition, gender-equality policy answers, parental leave, flexible work, and harm-prevention data — every WGEA-reporting employer in Australia, every year, with fuzzy employer-name search and a CC-BY 3.0 AU attribution contract."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harry Vass" }]
keywords = [
    "mcp", "model-context-protocol", "claude", "fastmcp",
    "wgea", "gender", "pay-gap", "gender-equality", "workforce",
    "diversity", "dei", "hr", "esg", "social-reporting",
    "australia", "australian", "public-data", "government-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.0,<4",
    "httpx>=0.27",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "pandas>=2.2,<3",
    "openpyxl>=3.1",
    "pyarrow>=15",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
    "aus-identity>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
wgea-mcp = "wgea_mcp.server:main"

[project.urls]
Homepage = "https://github.com/Bigred97/wgea-mcp"
Documentation = "https://github.com/Bigred97/wgea-mcp#readme"
Repository = "https://github.com/Bigred97/wgea-mcp"
Issues = "https://github.com/Bigred97/wgea-mcp/issues"
Changelog = "https://github.com/Bigred97/wgea-mcp/blob/main/CHANGELOG.md"
PyPI = "https://pypi.org/project/wgea-mcp/"

[tool.hatch.build.targets.wheel]
packages = ["src/wgea_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits real data.gov.au (downloads the WGEA public data file ZIP, ~71 MB)"]
addopts = "-m 'not live'"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# E402 — tests/test_parsing.py uses deliberate mid-file imports below
# a section comment block. Intentional pattern, not an error.
"tests/*" = ["E741", "F841", "F401", "E402"]
